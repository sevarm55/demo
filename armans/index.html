<style>
:root {

  --gold: #d6a85c; --gold2: #f0cf8e;
  --pad: clamp(16px, 4.4vw, 64px);
  --fd: "Dela Gothic One", "Noto Sans Armenian", system-ui, sans-serif;
  --fb: "Onest", "Noto Sans Armenian", system-ui, sans-serif;
  --fm: "JetBrains Mono", "Noto Sans Armenian", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--fb); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
html:lang(hy) h1, html:lang(hy) h2, html:lang(hy) .nm { font-family: "Noto Sans Armenian", sans-serif; font-weight: 800; letter-spacing: -.02em; }
a { color: inherit; }
button { font: inherit; color: inherit; }

.kick { margin: 0; font: 600 11px/1.3 var(--fm); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
h2 { margin: .35em 0 .4em; font: 400 clamp(30px, 5vw, 64px)/1.04 var(--fd); letter-spacing: -.01em; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 50px; padding: 0 22px; border: 0; border-radius: 999px; font: 600 14.5px/1 var(--fb); text-decoration: none; cursor: pointer; transition: transform .2s, background .3s, border-color .3s; }
.btn:active { transform: scale(.97); }
.btn-g { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #1a1209; }
.btn-o { border: 1px solid var(--line); background: rgba(9,8,7,.45); color: var(--ink); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.btn-o:hover { border-color: rgba(214,168,92,.6); }
.btn svg { width: 17px; height: 17px; flex: none; }

/* ---------- top ---------- */
.top { position: absolute; z-index: 8; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: calc(14px + env(safe-area-inset-top)) var(--pad) 0; pointer-events: none; }
.top > * { pointer-events: auto; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo i { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--gold); font: 400 15px/1 var(--fd); font-style: normal; color: var(--gold); }
.logo b { display: block; font: 400 16px/1 var(--fd); letter-spacing: .06em; }
.logo small { display: block; margin-top: 4px; font: 500 9px/1 var(--fm); letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
.langs { display: flex; }
.langs button { padding: 10px 7px; border: 0; background: none; font: 600 11px/1 var(--fm); letter-spacing: .08em; color: var(--mute); cursor: pointer; }
.langs button[aria-pressed="true"] { color: var(--ink); }

/* ---------- hero: cut him yourself ---------- */
.hero { position: relative; height: 100svh; min-height: 600px; overflow: hidden; background: var(--bg); }
.hero-bg { position: absolute; inset: -60px; background: url(media/interior.webp) center / cover; filter: blur(22px) brightness(.3) saturate(1.1); display: none; }
.stage { position: absolute; inset: 0; }
.stage img, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage img { object-fit: cover; object-position: 50% 32%; }
#gl { opacity: 0; transition: opacity .5s; }
.stage.ready #gl { opacity: 1; }
#fx { pointer-events: none; }
.hit { position: absolute; touch-action: none; cursor: none; }
.hit.free { touch-action: pan-y; cursor: auto; }
.shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(9,8,7,.6) 0%, rgba(9,8,7,0) 16%, rgba(9,8,7,0) 58%, rgba(9,8,7,.94) 88%); }
.clipper { position: absolute; left: 0; top: 0; width: 46px; height: 112px; pointer-events: none; transform-origin: 23px 4px; opacity: 0; transition: opacity .25s; z-index: 4; filter: drop-shadow(0 14px 14px rgba(0,0,0,.55)); }
.clipper.on { opacity: 1; }
.copy { position: absolute; z-index: 5; left: var(--pad); right: var(--pad); bottom: calc(118px + env(safe-area-inset-bottom)); pointer-events: none; }
.copy h1 { margin: 8px 0 0; font: 400 clamp(32px, 9.4vw, 46px)/1.02 var(--fd); letter-spacing: -.01em; text-shadow: 0 4px 30px rgba(0,0,0,.6); max-width: 11ch; transition: opacity .4s, transform .4s; }
.copy h1.swap { opacity: 0; transform: translateY(8px); }
.hint { display: inline-flex; align-items: center; gap: 9px; margin: 14px 0 0; padding: 8px 12px 8px 10px; border-radius: 999px; background: rgba(9,8,7,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); font: 600 11px/1.2 var(--fm); letter-spacing: .06em; color: var(--ink); transition: opacity .5s; }
.hint .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1.6s ease-out infinite; }
.hint.gone { opacity: 0; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(214,168,92,.7); } 100% { box-shadow: 0 0 0 12px rgba(214,168,92,0); } }
.panel { position: absolute; z-index: 6; left: var(--pad); right: var(--pad); bottom: calc(22px + env(safe-area-inset-bottom)); }
.meter { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; border: 1px solid var(--line); background: rgba(9,8,7,.62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font: 600 11px/1 var(--fm); letter-spacing: .1em; text-transform: uppercase; transition: opacity .4s, transform .4s; }
.bar { position: relative; height: 10px; border-radius: 6px; background: repeating-linear-gradient(90deg, rgba(243,234,217,.12) 0 6px, transparent 6px 9px); overflow: hidden; }
.bar i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: repeating-linear-gradient(90deg, var(--gold2) 0 6px, transparent 6px 9px); transition: transform .25s; }
.pct { min-width: 4ch; text-align: right; color: var(--gold2); }
.skip { display: inline-block; margin-top: 10px; padding: 6px 2px; font: 600 11px/1 var(--fm); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); text-decoration: none; }
.done { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px; border-radius: 22px; border: 1px solid rgba(214,168,92,.35); background: rgba(12,10,8,.82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); opacity: 0; transform: translateY(24px); pointer-events: none; transition: opacity .6s .2s, transform .6s .2s cubic-bezier(.2,.8,.2,1); }
.hero.finished .done { opacity: 1; transform: none; pointer-events: auto; }
.hero.finished .meter, .hero.finished .skip { opacity: 0; transform: translateY(10px); pointer-events: none; }
.done .score { display: flex; align-items: baseline; gap: 8px; font: 600 12px/1 var(--fm); color: var(--mute); }
.done .score b { font: 400 26px/1 var(--fd); color: var(--gold2); }
.done p { margin: 8px 0 14px; color: var(--ink); }
.done .row { display: flex; flex-wrap: wrap; gap: 8px; }
.again { background: none; border: 0; padding: 12px 6px; font: 600 12px/1 var(--fm); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); cursor: pointer; }

@media (min-width: 900px) {
  .hero-bg { display: block; }
  .stage { left: 50%; right: auto; width: min(100vw, 100svh * .75, 760px); transform: translateX(-50%);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent); mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent); }
  .shade { background: linear-gradient(180deg, rgba(9,8,7,.5) 0%, rgba(9,8,7,0) 22%, rgba(9,8,7,0) 75%, rgba(9,8,7,.8) 100%); }
  .copy { top: 50%; bottom: auto; transform: translateY(-50%); right: auto; width: calc(50vw - min(100vw, 100svh * .75, 760px) / 2 + 60px); max-width: 520px; }
  .copy h1 { font-size: clamp(38px, 3.9vw, 66px); }
  .panel { left: auto; right: var(--pad); bottom: 50%; transform: translateY(50%); width: min(360px, calc(50vw - min(100vw, 100svh * .75, 760px) / 2 + 40px)); }
  .done { position: absolute; bottom: auto; top: 50%; transform: translateY(-40%); }
  .hero.finished .done { transform: translateY(-50%); }
}

/* ---------- team ---------- */
.team { position: relative; padding: clamp(80px, 12vw, 160px) var(--pad); overflow: hidden; }
.team-in { position: relative; display: grid; gap: 40px; max-width: 1240px; margin: 0 auto; }
.team figure { margin: 0; border-radius: 22px; overflow: hidden; aspect-ratio: 4 / 3; }
.team figure img { width: 100%; height: 115%; object-fit: cover; display: block; will-change: transform; }
.barbers { list-style: none; margin: 26px 0 0; padding: 0; border-top: 1px solid var(--line); }
.barbers li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 4px 14px; padding: 20px 0; border-bottom: 1px solid var(--line); }
.barbers .idx { font: 600 11px/1 var(--fm); color: var(--gold); }
.barbers .nm { font: 400 clamp(22px, 3vw, 34px)/1.1 var(--fd); }
.barbers .role { grid-column: 2; font: 600 11px/1 var(--fm); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.barbers a { grid-column: 3; grid-row: 1 / span 2; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); text-decoration: none; transition: background .3s, border-color .3s, transform .3s; }
.barbers a:hover { background: var(--gold); border-color: var(--gold); color: #1a1209; transform: rotate(-45deg); }
.barbers a svg { width: 18px; height: 18px; }
@media (min-width: 900px) {
  .team-in { grid-template-columns: 1fr 1fr; align-items: center; gap: 70px; }
  .team figure { aspect-ratio: 3 / 4; order: 2; }

/* ---------- price: a printed receipt ---------- */
.bill { position: relative; padding: clamp(70px, 10vw, 140px) var(--pad) clamp(70px, 10vw, 130px); background: radial-gradient(80% 60% at 50% 0%, rgba(214,168,92,.09), transparent 70%); }
.bill-head { max-width: 1240px; margin: 0 auto 40px; text-align: center; }

.printer { position: relative; width: min(420px, 100%); margin: 0 auto; }
.slot { position: relative; z-index: 2; height: 58px; border-radius: 16px 16px 10px 10px; background: linear-gradient(180deg, #2b2724, #151311); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 20px 40px -20px rgba(0,0,0,.8); }
.slot::after { content: ""; position: absolute; left: 22px; right: 22px; bottom: 12px; height: 5px; border-radius: 3px; background: #050404; box-shadow: inset 0 2px 3px rgba(0,0,0,.9); }
.slot .led { position: absolute; top: 14px; right: 20px; width: 7px; height: 7px; border-radius: 50%; background: #3f3a34; }
.bill.printing .led { background: #7be08b; box-shadow: 0 0 10px #7be08b; animation: blink .5s steps(2) infinite; }
.slot .brand { position: absolute; top: 12px; left: 22px; font: 600 10px/1 var(--fm); letter-spacing: .2em; color: rgba(243,234,217,.4); }
@keyframes blink { 50% { opacity: .3; } }
.feed { position: relative; margin: -12px 30px 0; overflow: hidden; padding-bottom: 30px; }
.paper { --z: 9px; position: relative; padding: 30px 22px 34px; background: #f6f1e6; color: #1d1915; font: 400 12.5px/1.6 var(--fm); box-shadow: 0 24px 30px -18px rgba(0,0,0,.7);
  transform: translateY(-100%);
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--z)) 100%; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--z)) 100%; }
.bill.printing .paper, .bill.printed .paper { transform: translateY(0); transition: transform 3.4s steps(34, end); }
.paper .c { text-align: center; }
.paper .big { font: 400 20px/1.1 var(--fd); letter-spacing: .06em; }
.paper hr { border: 0; border-top: 1.5px dashed rgba(29,25,21,.45); margin: 12px 0; }
.paper .ln { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 5px 0; }
.paper .ln small { grid-column: 1; color: #7a7066; font-size: 11px; }
.paper .ln b { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 600; white-space: nowrap; }
.paper .tot { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 13.5px; }
.paper .bc { height: 40px; margin: 14px auto 6px; width: 78%; background: repeating-linear-gradient(90deg, #1d1915 0 2px, transparent 2px 4px, #1d1915 4px 5px, transparent 5px 8px, #1d1915 8px 11px, transparent 11px 13px, #1d1915 13px 14px, transparent 14px 18px); }
.bill-cta { display: flex; justify-content: center; margin-top: 8px; }

/* ---------- visit ---------- */
.visit { position: relative; overflow: hidden; }
.visit > img { display: block; width: 100%; height: 50svh; object-fit: cover; object-position: 50% 45%; }
.visit::before { content: ""; position: absolute; z-index: 1; left: 0; right: 0; top: 0; height: 50svh; pointer-events: none; background: linear-gradient(180deg, var(--bg), rgba(9,8,7,0) 22%, rgba(9,8,7,0) 55%, var(--bg)); }
.v-in { position: relative; z-index: 2; margin-top: -70px; padding: 0 var(--pad) 76px; }
@media (min-width: 900px) {
  .visit { min-height: 92svh; display: flex; align-items: flex-end; }
  .visit > img { position: absolute; inset: 0; height: 100%; }
  .visit::before { height: auto; bottom: 0; background: linear-gradient(90deg, rgba(9,8,7,.95) 0%, rgba(9,8,7,.78) 42%, rgba(9,8,7,.2) 100%), linear-gradient(180deg, var(--bg), rgba(9,8,7,0) 22%, rgba(9,8,7,0) 75%, var(--bg)); }
  .v-in { width: 100%; max-width: 1240px; margin: 0 auto; padding: 140px var(--pad) 40px; }
}
.v-score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.v-score b { font: 400 clamp(52px, 7vw, 86px)/1 var(--fd); color: var(--gold2); }
.v-score span { color: var(--mute); }
.facts { list-style: none; margin: 22px 0 26px; padding: 0; display: grid; gap: 6px; font-size: 17px; }
.facts li::before { content: "— "; color: var(--gold); }
.v-row { display: flex; flex-wrap: wrap; gap: 10px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 60px; padding-top: 18px; border-top: 1px solid var(--line); font: 500 11px/1.4 var(--fm); letter-spacing: .08em; color: var(--mute); }

.demo { position: fixed; z-index: 30; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: calc(100vw - 24px); padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: rgba(9,8,7,.8); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font: 500 10px/1.2 var(--fm); color: var(--mute); pointer-events: none; opacity: 0; transition: opacity .4s; }
.demo.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .paper, .bill.printing .paper { transition: none; } }
</style>

      var ca = Math.cos(p.a) * p.len, sa = Math.sin(p.a) * p.len;
      fctx.strokeStyle = "rgba(" + p.r + "," + p.g + "," + p.b + "," + Math.min(1, p.life * 1.4).toFixed(2) + ")";
      fctx.lineWidth = p.w;
      fctx.beginPath(); fctx.moveTo(p.x, p.y); fctx.quadraticCurveTo(p.x + ca * .5 - sa * .25, p.y + sa * .5 + ca * .25, p.x + ca, p.y + sa); fctx.stroke();
    }
    if (parts.length || dirty || (finished && done < 1) || ghostOn) kick();
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }

  /* the clipper that follows your hand */
  function moveClipper(x, y, show) {
    if (lastCss) {
      var dx = x - lastCss[0], dy = y - lastCss[1];
      if (dx * dx + dy * dy > 4) { var t = Math.atan2(dy, dx) + Math.PI / 2, d = t - angle; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; angle += d * .25; }
    }
    var lim = 1.1; angle = Math.max(-lim, Math.min(lim, angle));
    clip.style.transform = "translate(" + (x - 23) + "px," + (y - 4) + "px) rotate(" + angle.toFixed(3) + "rad)";
    clip.classList.toggle("on", !!show);
  }
  function local(e) { var r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  var down = false, OFF = 34;
  function firstTouch() {
    if (!interacted) { interacted = true; stopGhost(); if (stage_ !== "done") { stage_ = "cutting"; $("#hint").classList.add("gone"); } }
  }
  hit.addEventListener("pointerdown", function (e) {
    if (finished) return;
    firstTouch(); down = true; last = null; lastCss = null;
    try { hit.setPointerCapture(e.pointerId); } catch (er) {}
    var p = local(e), y = e.pointerType === "mouse" ? p[1] : p[1] - OFF;
    moveClipper(p[0], y, true); cutTo(p[0], y);
  });
  hit.addEventListener("pointermove", function (e) {
    if (finished) return;
    var p = local(e), mouse = e.pointerType === "mouse", y = mouse ? p[1] : p[1] - OFF;
    if (mouse || down) {
      moveClipper(p[0], y, true);
      if (mouse && !down && !interacted) firstTouch();
      cutTo(p[0], y);
    }
  });
  function up() { down = false; last = null; lastCss = null; if (touchy) clip.classList.remove("on"); }
  hit.addEventListener("pointerup", up); hit.addEventListener("pointercancel", up);
  hit.addEventListener("pointerleave", function () { last = null; lastCss = null; if (!down) clip.classList.remove("on"); });

  /* a ghost pass shows how it works, then hands over */
  var ghostOn = false, ghostT = 0, ghostTimer = 0;
  var GP = [[.25, .5], [.255, .4], [.27, .3], [.31, .22], [.37, .17], [.45, .14], [.36, .24], [.3, .33], [.29, .44]];
  function ghost(now) {
    if (!ghostOn) return;
    var t = Math.min(1, (now - ghostT) / 1700), seg = t * (GP.length - 1), i = Math.min(GP.length - 2, Math.floor(seg)), f = seg - i;
    var u = GP[i][0] + (GP[i + 1][0] - GP[i][0]) * f, v = GP[i][1] + (GP[i + 1][1] - GP[i][1]) * f, c = toCss(u, v);
    moveClipper(c[0], c[1], true); cutTo(c[0], c[1]);
    if (t < 1) requestAnimationFrame(ghost);
    else { ghostOn = false; last = null; lastCss = null; setTimeout(function () { if (!interacted) clip.classList.remove("on"); }, 300); stage_ = "yours"; if (!interacted) $("#hintT").textContent = T.hint_go[lang]; }
  }
  function startGhost() { if (interacted || reduce || finished) return; ghostOn = true; ghostT = performance.now(); last = null; lastCss = null; requestAnimationFrame(ghost); }
  function stopGhost() { clearTimeout(ghostTimer); if (ghostOn) { ghostOn = false; last = null; lastCss = null; } }

  if (gl) {
    Promise.all([loadImg("media/before.webp"), loadImg("media/after.webp"), loadImg("media/mask.webp")]).then(function (im) {
      TB = tex(0, im[0]); TA = tex(1, im[1]); TM = tex(2, im[2]); TC = tex(3, C);
      prepGrid(im[2], im[0]);
      ready = true; size();
      ghostTimer = setTimeout(startGhost, 1500);
    }).catch(function () { gl = null; fallback(); });
  } else fallback();
  function fallback() {
    // no WebGL: show the finished cut and the booking card
    $("#still").src = "media/after.webp"; finished = true; stage_ = "done"; hero.classList.add("finished");
    $("#h1").textContent = T.done_h[lang]; $("#hint").classList.add("gone"); hit.classList.add("free");
  }
  addEventListener("resize", function () { clearTimeout(size.t); size.t = setTimeout(size, 100); });
  size();

  /* ---------- team image drifts a little ---------- */
  var toolsImg = $("#toolsImg"), demo = $("#demo");
  function onScroll() {
    var r = toolsImg.parentNode.getBoundingClientRect();
    if (r.bottom > 0 && r.top < innerHeight) toolsImg.style.transform = "translateY(" + (-(r.top + r.height / 2 - innerHeight / 2) * .08 - r.height * .07).toFixed(1) + "px)";
    demo.classList.toggle("on", scrollY > innerHeight * .5);
  }
  addEventListener("scroll", onScroll, { passive: true }); onScroll();

  /* ---------- the receipt prints when it comes into view ---------- */
  var bill = $("#bill");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (en) {
      if (en[0].isIntersecting) { bill.classList.add("printing"); setTimeout(function () { bill.classList.remove("printing"); bill.classList.add("printed"); }, 3500); io.disconnect(); }
    }, { threshold: .35 });
    io.observe(bill);
  } else bill.classList.add("printed");

  var q = new URLSearchParams(location.search).get("lang"), saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  setLang(q || saved || "hy");
})();
</script>
