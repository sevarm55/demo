<style>
:root { --bg: #EAF1EF; --bg-2: #DDEAE6; --ink: #0F2E2C; --soft: rgba(15,46,44,.64); --line: rgba(15,46,44,.14); --aqua: #5FAEA4; --aqua-2: #9BD3CB; --white: #FFFFFF;
  --font: "Commissioner", "Noto Sans Armenian", system-ui, sans-serif; --pad: clamp(18px, 4.5vw, 64px); --ease: cubic-bezier(.2,.7,.1,1); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 300; -webkit-font-smoothing: antialiased; overflow-x: clip; }
a { color: inherit; }
svg.i { width: 1.1em; height: 1.1em; fill: currentColor; flex: none; }

.top { position: fixed; z-index: 20; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: 16px var(--pad); transition: background-color .4s; }
.top.solid { background: rgba(234,241,239,.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.brand { font-weight: 500; font-size: .82rem; letter-spacing: .34em; text-transform: uppercase; margin-right: auto; text-decoration: none; }
.langs button { font: inherit; font-size: .85rem; background: none; border: 0; color: inherit; opacity: .5; cursor: pointer; padding: 8px 6px; }
.langs button[aria-pressed="true"] { opacity: 1; font-weight: 500; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .55em; min-height: 54px; padding: .85em 1.6em; border-radius: 999px; font-weight: 500; font-size: 1rem; text-decoration: none; transition: transform .25s var(--ease), background-color .25s; }
.btn:hover { transform: translateY(-2px); }
.btn-a { background: var(--ink); color: var(--white); }
.btn-o { border: 1px solid rgba(15,46,44,.28); background: rgba(255,255,255,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

/* ---------- 1. water hero ---------- */
.hero { position: relative; height: 100svh; min-height: 620px; overflow: hidden; }
#water { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: crosshair; background: #DCEBE8 center / cover no-repeat; }
.hero .veil { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(234,241,239,.88) 0%, rgba(234,241,239,.45) 38%, rgba(234,241,239,0) 62%); }
.copy { position: absolute; left: var(--pad); bottom: clamp(30px, 8vh, 80px); max-width: 560px; }
.k { margin: 0 0 12px; font-size: .95rem; letter-spacing: .06em; color: var(--soft); }
h1 { margin: 0; font-weight: 200; line-height: .85; }
h1 .a { display: block; font-size: clamp(5.4rem, 15vw, 14rem); letter-spacing: .14em; text-transform: uppercase; margin-left: -.06em; }
h1 .b { display: block; font-size: clamp(1rem, 1.6vw, 1.3rem); letter-spacing: .5em; text-transform: uppercase; font-weight: 400; margin-top: .9em; color: var(--soft); }
.tag { margin: 22px 0 26px; font-size: clamp(1.2rem, 2vw, 1.7rem); line-height: 1.3; max-width: 22ch; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.hint { position: absolute; right: var(--pad); bottom: clamp(30px, 8vh, 80px); display: flex; align-items: center; gap: 12px; font-size: .85rem; letter-spacing: .06em; color: var(--soft); pointer-events: none; }
.hint i { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; position: relative; }
.hint i::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid currentColor; animation: ring 2.4s ease-out infinite; }
@keyframes ring { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.8); opacity: 0; } }

/* soft water edge between sections */
.wave { display: block; width: 100%; height: 60px; margin-top: -59px; position: relative; z-index: 2; }

/* ---------- 2. skin diagnostics lens ---------- */
.diag { padding: clamp(80px, 11vw, 150px) var(--pad); }
.diag-in { max-width: 1240px; margin: 0 auto; display: grid; gap: clamp(36px, 6vw, 90px); align-items: center; }
@media (min-width: 960px) { .diag-in { grid-template-columns: .9fr 1.1fr; } }
.diag h2, .proc h2, .visit h2 { margin: 0 0 14px; font-weight: 200; font-size: clamp(2.6rem, 6vw, 5rem); line-height: .95; letter-spacing: -.01em; }
.lead { margin: 0 0 34px; color: var(--soft); font-size: 1.1rem; line-height: 1.5; max-width: 36ch; }
.metric { margin-bottom: 22px; }
.metric .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 1.05rem; }
.metric .row b { font-weight: 500; font-variant-numeric: tabular-nums; }
.metric .row b span { color: var(--soft); font-weight: 300; }
.bar { height: 6px; border-radius: 6px; background: rgba(15,46,44,.1); position: relative; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, var(--aqua-2), var(--aqua)); width: 0; transition: width 1.6s var(--ease); }
.face { position: relative; aspect-ratio: 3 / 4; border-radius: 26px; overflow: hidden; touch-action: pan-y; cursor: none; box-shadow: 0 40px 90px -40px rgba(15,46,44,.45); background: #E3ECEA; }
.face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.face .after { clip-path: circle(var(--r, 110px) at var(--x, 50%) var(--y, 40%)); filter: brightness(1.02); }
.lens { position: absolute; left: var(--x, 50%); top: var(--y, 40%); width: calc(var(--r, 110px) * 2); height: calc(var(--r, 110px) * 2); margin: calc(var(--r, 110px) * -1) 0 0 calc(var(--r, 110px) * -1); border-radius: 50%; border: 2px solid rgba(255,255,255,.95); box-shadow: 0 0 0 1px rgba(15,46,44,.15), 0 12px 40px rgba(15,46,44,.25), inset 0 0 30px rgba(255,255,255,.35); pointer-events: none; }
.lens::after { content: ""; position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%); }
.tagpill { position: absolute; padding: 7px 14px; border-radius: 999px; font-size: .85rem; font-weight: 500; background: rgba(255,255,255,.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tagpill.l { left: 16px; bottom: 16px; } .tagpill.r { right: 16px; bottom: 16px; background: var(--ink); color: #fff; }
.face-hint { margin: 14px 0 0; text-align: center; color: var(--soft); font-size: .9rem; }

/* ---------- 3. procedures (accordion) ---------- */
.proc { padding: clamp(80px, 11vw, 150px) var(--pad); background: var(--bg-2); }
.proc-in { max-width: 980px; margin: 0 auto; }
.acc { list-style: none; margin: 30px 0 0; padding: 0; border-top: 1px solid var(--line); }
.acc li { border-bottom: 1px solid var(--line); }
.acc button { width: 100%; display: grid; grid-template-columns: 1fr auto 28px; gap: 18px; align-items: center; padding: 24px 0; font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
.acc .n { font-weight: 300; font-size: clamp(1.35rem, 2.6vw, 2.1rem); line-height: 1.15; }
.acc .p { font-weight: 500; font-size: clamp(1rem, 1.6vw, 1.25rem); white-space: nowrap; font-variant-numeric: tabular-nums; color: #2E7E75; }
.acc .plus { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); position: relative; transition: transform .4s var(--ease), background-color .3s; }
.acc .plus::before, .acc .plus::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 1.5px; margin: -.75px 0 0 -6px; background: var(--ink); }
.acc .plus::after { transform: rotate(90deg); transition: transform .4s var(--ease); }
.acc li.open .plus { background: var(--ink); } .acc li.open .plus::before, .acc li.open .plus::after { background: #fff; }
.acc li.open .plus::after { transform: rotate(0); }
.acc .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease); }
.acc li.open .body { grid-template-rows: 1fr; }
.acc .body > div { overflow: hidden; }
.acc .body p { margin: 0 0 24px; color: var(--soft); max-width: 60ch; line-height: 1.55; }
.acc .body p b { color: var(--ink); font-weight: 500; }
.note { margin: 22px 0 0; color: var(--soft); font-size: .88rem; }

/* ---------- 4. visit ---------- */
.visit { padding: clamp(80px, 11vw, 150px) var(--pad) 40px; }
.visit-in { max-width: 1240px; margin: 0 auto; display: grid; gap: clamp(36px, 6vw, 80px); }
@media (min-width: 960px) { .visit-in { grid-template-columns: 1fr 1fr; align-items: end; } }
.score { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin: 0 0 18px; }

.score span { color: var(--soft); font-size: 1.1rem; max-width: 14ch; line-height: 1.35; }
.quote { margin: 0; font-size: clamp(1.3rem, 2.4vw, 2rem); font-weight: 200; line-height: 1.25; }
.quote::before { content: "“"; color: var(--aqua); } .quote::after { content: "”"; color: var(--aqua); }
.facts { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 30px; }
.facts h3 { margin: 0 0 6px; font-size: .85rem; font-weight: 400; color: var(--soft); }
.facts p, .facts a { margin: 0; font-size: 1.12rem; text-decoration: none; line-height: 1.4; }

.hours { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.hours th { text-align: left; font-weight: 300; padding: 2px 18px 2px 0; color: var(--soft); }
.hours td { padding: 2px 0; }
.foot { max-width: 1240px; margin: clamp(50px, 8vw, 90px) auto 0; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: .85rem; color: var(--soft); }
.demo { position: fixed; z-index: 30; left: 50%; top: 58px; transform: translateX(-50%); background: rgba(15,46,44,.78); color: #fff; font-family: "Noto Sans Armenian", system-ui, sans-serif; font-size: .64rem; padding: 5px 11px; border-radius: 999px; white-space: nowrap; pointer-events: none; }

@media (max-width: 820px) {

  .face { cursor: auto; }
}
@media (prefers-reduced-motion: reduce) { .hint i::after { animation: none; } .bar i, .acc .body { transition: none; } }
</style>

    [{ hy: "SpheroGel՝ ամբողջական գիծ", ru: "SpheroGel — полная линия", en: "SpheroGel, the full line" }, 35000, 45, { hy: "Միայն Esta Clinic-ում՝ SpheroGel-ի ամբողջական գծով պրոցեդուրաներ փորձառու մասնագետների ձեռքով։", ru: "Только в Esta Clinic — процедуры полной линией SpheroGel у опытных специалистов.", en: "Only at Esta Clinic: treatments with the full SpheroGel line by experienced specialists." }],
    [{ hy: "V Carbon System", ru: "V Carbon System", en: "V Carbon System" }, 20000, 40, { hy: "Կարբոնային պիլինգ՝ ծակոտիների խորը մաքրում և հարթ, լուսավոր մաշկ։", ru: "Карбоновый пилинг — глубокое очищение пор и ровная, светлая кожа.", en: "Carbon peel: deep pore cleansing and smooth, brighter skin." }],

  ];
  var HOURS = [[{ hy: "Երկ–Ուրբ", ru: "Пн–Пт", en: "Mon–Fri" }, "10:00–20:00"], [{ hy: "Շաբաթ", ru: "Сб", en: "Sat" }, "10:00–18:00"], [{ hy: "Կիրակի", ru: "Вс", en: "Sun" }, "11:00–18:00"]];
  var lang = "hy", openIdx = 0, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  new IntersectionObserver(function (es, o) { if (!es[0].isIntersecting) return; o.disconnect(); metricsShown = true; document.querySelectorAll(".bar i").forEach(function (b, i) { b.style.width = METRICS[i][2] + "%"; }); }, { threshold: .4 }).observe(document.getElementById("metrics"));

  /* ---------- water ripples: a height field simulated on the CPU, refracted on the GPU ---------- */
  var cv = document.getElementById("water"), mobile = innerWidth < 820;
  var imgSrc = innerWidth / innerHeight < .9 ? "media/water-v.webp" : "media/water-l.webp";
  cv.style.backgroundImage = "url(" + imgSrc + ")";
  var gl = cv.getContext("webgl", { antialias: false, premultipliedAlpha: false }) || cv.getContext("experimental-webgl");
  if (gl) {
    var GW, GH, cur, prev, buf, pixels, texH, texI, prog, uScale, img = new Image(), ready = false, visible = true;
    var vs = "attribute vec2 p; varying vec2 uv; void main(){ uv = p * .5 + .5; uv.y = 1. - uv.y; gl_Position = vec4(p, 0., 1.); }";
    var fs = "precision mediump float; varying vec2 uv; uniform sampler2D img, hf; uniform vec2 sc;" +
      "void main(){ vec4 h = texture2D(hf, uv); vec2 d = (h.rg - .5) * .14;" +
      " vec2 iu = (uv + d - .5) * sc + .5; vec3 c = texture2D(img, iu).rgb;" +
      " float light = (h.r - .5) * 1.4 - (h.g - .5) * 1.1; c += max(light, 0.) * .85 - max(-light, 0.) * .22;" +
      " gl_FragColor = vec4(c, 1.); }";
    function sh(t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }
    prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
    var vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uScale = gl.getUniformLocation(prog, "sc");
    gl.uniform1i(gl.getUniformLocation(prog, "img"), 0); gl.uniform1i(gl.getUniformLocation(prog, "hf"), 1);

      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
    texI = mkTex(0); texH = mkTex(1);
    function resize() {
      var d = Math.min(devicePixelRatio || 1, mobile ? 1.5 : 1.75), W = cv.clientWidth, H = cv.clientHeight;
      cv.width = Math.round(W * d); cv.height = Math.round(H * d); gl.viewport(0, 0, cv.width, cv.height);
      GW = mobile ? 120 : 200; GH = Math.max(40, Math.round(GW * H / W));
      cur = new Float32Array(GW * GH); prev = new Float32Array(GW * GH); pixels = new Uint8Array(GW * GH * 4);
      if (img.naturalWidth) { var ca = W / H, ia = img.naturalWidth / img.naturalHeight; gl.uniform2f(uScale, ca > ia ? 1 : ca / ia, ca > ia ? ia / ca : 1); }
    }
    function drop(x, y, r, a) {
      var gx = Math.round(x * GW), gy = Math.round(y * GH);
      for (var j = -r; j <= r; j++) for (var i = -r; i <= r; i++) {
        var X = gx + i, Y = gy + j, dd = i * i + j * j; if (X < 1 || Y < 1 || X >= GW - 1 || Y >= GH - 1 || dd > r * r) continue;
        cur[Y * GW + X] += a * (1 - Math.sqrt(dd) / r);
      }
    }
    function step() {
      var n, k, w = GW;
      for (var y = 1; y < GH - 1; y++) for (var x = 1; x < w - 1; x++) {
        k = y * w + x; n = (cur[k - 1] + cur[k + 1] + cur[k - w] + cur[k + w]) * .5 - prev[k]; prev[k] = n * .975;
      }
      var t = cur; cur = prev; prev = t;
      for (var y2 = 1; y2 < GH - 1; y2++) for (var x2 = 1; x2 < w - 1; x2++) {
        k = y2 * w + x2; var dx = cur[k + 1] - cur[k - 1], dy = cur[k + w] - cur[k - w], o = k * 4;
        pixels[o] = Math.max(0, Math.min(255, 128 + dx * 60)); pixels[o + 1] = Math.max(0, Math.min(255, 128 + dy * 60)); pixels[o + 2] = 128; pixels[o + 3] = 255;

      var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;

  /* ---------- skin lens ---------- */
  var face = document.getElementById("face"), lensR = 110, touched = false, lx = .5, ly = .38, tx = .5, ty = .38, t0 = performance.now();
  function setLens() { face.style.setProperty("--x", (lx * 100) + "%"); face.style.setProperty("--y", (ly * 100) + "%"); face.style.setProperty("--r", lensR + "px"); }
