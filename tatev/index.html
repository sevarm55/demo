.btn-o { border: 1px solid rgba(246,236,228,.38); background: rgba(246,236,228,.06); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

/* ---------- 1. hero over the hair ---------- */

.tag { margin: 16px 0 22px; color: var(--soft); font-size: clamp(1rem, 1.4vw, 1.2rem); line-height: 1.45; max-width: 32ch; }
.sw { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.sw > span { font-size: .92rem; margin-right: 2px; }
.sw button { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; background: var(--c); position: relative; padding: 0; }
.sw button::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid var(--ink); opacity: 0; transition: opacity .3s; }

.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.hint { position: absolute; right: var(--pad); bottom: clamp(28px, 7vh, 72px); font-size: .82rem; color: var(--soft); letter-spacing: .06em; display: flex; align-items: center; gap: 10px; }
.hint i { width: 34px; height: 1px; background: currentColor; animation: hint 2.4s ease-in-out infinite; transform-origin: left; }

/* ---------- 3. prices ---------- */

.p-note { margin: 22px 0 0; color: var(--soft); font-size: .88rem; }
