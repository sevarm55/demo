  function src(i) { return "frames/" + dir + "/f" + String(i + 1).padStart(3, "0") + ".webp"; }
  function load(i) { if (frames[i]) return; var im = new Image(); im.decoding = "async"; im.onload = function () { if (i === want || cur < 0) draw(want, true); }; im.src = src(i); frames[i] = im; }
  load(0); for (var j = 6; j < N; j += 6) load(j);
  setTimeout(function () { for (var j = 0; j < N; j++) load(j); }, 400);
  function ok(im) { return im && im.complete && im.naturalWidth; }
  function draw(i, force) {
    if (i === cur && !force) return;
    var im = ok(frames[i]) ? frames[i] : null;
    for (var k = 1; !im && k < N; k++) im = ok(frames[i - k]) ? frames[i - k] : ok(frames[i + k]) ? frames[i + k] : null;
    if (!im) return; cur = i;
    var cw = cv.width, ch = cv.height, s = Math.max(cw / im.naturalWidth, ch / im.naturalHeight), w = im.naturalWidth * s, h = im.naturalHeight * s;
    ctx.drawImage(im, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  /* ---------- the "23" veil ---------- */
  var W, H, ox, oy;
  function layout() {
    W = innerWidth; H = innerHeight;
    var d = Math.min(devicePixelRatio || 1, 2); cv.width = W * d; cv.height = H * d; cur = -1;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    var fs = Math.min(W * 1.02, H * 0.92), base = H / 2 + fs * 0.36;
    t23.setAttribute("font-size", fs); t23.setAttribute("x", W / 2); t23.setAttribute("y", base);
    // zoom origin = deepest point inside the digits (distance transform on a small canvas)
    var k = 4, cw = Math.ceil(W / k), chh = Math.ceil(H / k), c = document.createElement("canvas"); c.width = cw; c.height = chh;
    var g = c.getContext("2d"); g.font = "900 " + fs / k + 'px "Sofia Sans Extra Condensed"'; g.textAlign = "center"; g.fillText("23", W / 2 / k, base / k);
    var a = g.getImageData(0, 0, cw, chh).data, dd = new Float32Array(cw * chh), i, x, y, best = -1; ox = W / 2; oy = H / 2;
    for (i = 0; i < cw * chh; i++) dd[i] = a[i * 4 + 3] > 127 ? 1e9 : 0;
    for (y = 0; y < chh; y++) for (x = 0; x < cw; x++) { i = y * cw + x; if (!dd[i]) continue; var m = dd[i];
      if (x) m = Math.min(m, dd[i - 1] + 1); if (y) m = Math.min(m, dd[i - cw] + 1); if (x && y) m = Math.min(m, dd[i - cw - 1] + 1.41); if (y && x < cw - 1) m = Math.min(m, dd[i - cw + 1] + 1.41); dd[i] = m; }
    for (y = chh - 1; y >= 0; y--) for (x = cw - 1; x >= 0; x--) { i = y * cw + x; if (!dd[i]) continue; var m2 = dd[i];
      if (x < cw - 1) m2 = Math.min(m2, dd[i + 1] + 1); if (y < chh - 1) m2 = Math.min(m2, dd[i + cw] + 1); if (x < cw - 1 && y < chh - 1) m2 = Math.min(m2, dd[i + cw + 1] + 1.41); if (x && y < chh - 1) m2 = Math.min(m2, dd[i + cw - 1] + 1.41); dd[i] = m2;
      if (m2 > best) { best = m2; ox = x * k + k / 2; oy = y * k + k / 2; } }
    measureRoll(); tick(); draw(want, true);
  }

  /* ---------- end-credit price roll ---------- */
  var rollStart = 0, rollDist = 0;
  function measureRoll() {
    var vh = innerHeight, finMid = fin.offsetTop + fin.offsetHeight / 2;
    rollStart = vh * 0.82;                       // list starts just below the fold
    var end = vh / 2 - finMid;                   // ...and stops with the final card centred
    rollDist = Math.max(0, rollStart - end);
    roll.style.height = (rollDist * 1.15 + vh) + "px";
  }

  /* ---------- scroll ---------- */
  var idle = 0, idleT = 0, ticking = false;
  function tick() {
    ticking = false;
    if (ox === undefined) return;
    var vh = innerHeight, total = film.offsetHeight - vh, p = clamp(-film.getBoundingClientRect().top / total);
    if (reduce) p = p > .01 ? Math.max(p, .5) : 0;
    // fly through the 23
    var z = clamp(p / .2), s = 1 + Math.pow(z, 2.2) * 14;
    t23.setAttribute("transform", "translate(" + ox + " " + oy + ") scale(" + s + ") translate(" + -ox + " " + -oy + ")");
    var gone = clamp((z - .55) / .4);
    veilRect.style.opacity = 1 - gone; grain.style.opacity = .1 * (1 - gone);
    intro.style.opacity = 1 - clamp(p / .04);
    top.classList.toggle("on-stone", gone < .5);
    top.classList.toggle("solid", film.getBoundingClientRect().bottom < vh * .5);
    shade.style.opacity = clamp((p - .16) / .08);
    prog.style.opacity = clamp((p - .2) / .05); prog.firstChild.style.transform = "scaleX(" + clamp((p - .2) / .75) + ")";
    // footage follows the scroll; at the very top it idles so the 23 feels alive
    want = p < .012 ? idle : Math.min(N - 1, Math.round(clamp(p / .95) * (N - 1)));
    draw(want);
    credits.forEach(function (c) {
      var a = +c.dataset.from, b = +c.dataset.to, o = Math.min(clamp((p - a) / .05), 1 - clamp((p - (b - .05)) / .05));
      c.style.opacity = o; c.style.filter = o < 1 ? "blur(" + (1 - o) * 12 + "px)" : "none"; c.style.letterSpacing = (1 - o) * .08 + "em";
    });
    // price roll
    var rr = roll.getBoundingClientRect(), q = clamp(-rr.top / Math.max(1, roll.offsetHeight - vh) * 1.15);
    rollList.style.transform = "translateY(" + (rollStart - q * rollDist) + "px)";
    fab.classList.toggle("show", p > .22 && rr.top > -roll.offsetHeight + vh * 1.2);
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(tick); } }
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", layout);
  if (!reduce) setInterval(function () { if (window.scrollY < 20) { idle = (idle + 1) % 36; if (want !== idle) { want = idle; draw(idle); } } }, 1000 / 12);

  var initial = null;
  try { initial = new URLSearchParams(location.search).get("lang") || localStorage.getItem("lang"); } catch (e) {}
  setLang(initial || "hy");
  layout();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { layout(); });
})();
</script>
